<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1100" width="1140" height="1100"
     font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <title>Ashen Era Intelligence Assistant — architecture</title>
  <desc>Deterministic-first pipeline: read-only corpus, ingestion to evidence units, graph
        construction from infobox rows, three declining query tiers, synthesis and UI. External
        model calls are isolated at four points, two of which are off by default.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f4a6d"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect width="1140" height="1100" fill="#ffffff"/>

  <!-- ============================ heading ============================ -->
  <text x="20" y="36" font-size="21" font-weight="600" fill="#16202c">Ashen Era Intelligence Assistant — architecture</text>
  <text x="20" y="58" font-size="12" fill="#5a6672">Codefest 2026 sub-track 1B. Deterministic-first: every stage resolves without a model, and escalates only on a named, testable failure.</text>
  <text x="20" y="74" font-size="12" fill="#5a6672">Every number below is re-derived from the live corpus by <tspan font-family="Consolas, monospace">tests/test_diagram.py</tspan>, so this diagram cannot go stale silently.</text>

  <!-- ============================ corpus ============================= -->
  <rect x="345" y="98" width="460" height="56" rx="4" fill="#f0ecf9" stroke="#54388f" stroke-width="1.5"/>
  <text x="575" y="120" font-size="13" font-weight="600" text-anchor="middle" fill="#16202c">Ashen Era Archive — read-only, and not committed</text>
  <text x="575" y="139" font-size="10.5" text-anchor="middle" fill="#5a6672">341 files verified · 0 modified · <tspan font-family="Consolas, monospace">src/ingest/integrity.py</tspan> (F-016)</text>

  <!-- ============================ ingest ============================= -->
  <rect x="305" y="194" width="540" height="92" rx="4" fill="#eef3f9" stroke="#2f4a6d" stroke-width="1.5"/>
  <text x="575" y="216" font-size="13" font-weight="600" text-anchor="middle" fill="#16202c">src/ingest/ — discover → deduplicate → assign authority → load</text>
  <text x="575" y="238" font-size="10.5" text-anchor="middle" fill="#3c4a5a">340 documents scanned → 317 canonical · 22 duplicates collapsed</text>
  <text x="575" y="256" font-size="10.5" text-anchor="middle" fill="#5a6672">Deduplication is collection-dependent: chronicles/codex similarity 1.000 and 0.989,</text>
  <text x="575" y="272" font-size="10.5" text-anchor="middle" fill="#5a6672">but ephemera same-stem files score 0.019–0.048 and are different documents (ADR-003)</text>

  <!-- ========================= evidence units ======================== -->
  <rect x="345" y="326" width="460" height="56" rx="4" fill="#eaf4ec" stroke="#2c6e49" stroke-width="1.5"/>
  <text x="575" y="348" font-size="13" font-weight="600" text-anchor="middle" fill="#16202c">EvidenceUnit × 30,553</text>
  <text x="575" y="367" font-size="10.5" text-anchor="middle" fill="#5a6672">canonical document id · locator · authority tier — provenance attached once, here</text>

  <!-- =========================== graph build ========================= -->
  <rect x="305" y="422" width="540" height="84" rx="4" fill="#eef3f9" stroke="#2f4a6d" stroke-width="1.5"/>
  <text x="575" y="444" font-size="13" font-weight="600" text-anchor="middle" fill="#16202c">src/graph/ — cells.py · entities.py · build.py</text>
  <text x="575" y="464" font-size="10.5" text-anchor="middle" fill="#3c4a5a">651 infobox cells → 12 closed templates (ADR-010) · 109 field names → 15 relations · 0 unmapped</text>
  <text x="575" y="481" font-size="10.5" text-anchor="middle" fill="#5a6672">the infobox is the first pipe table, not the ## Infobox heading (ADR-009)</text>
  <text x="575" y="498" font-size="10.5" text-anchor="middle" fill="#5a6672">rows are a sequence, not a mapping (F-018) · exact-match entity keys only (ADR-011)</text>

  <!-- ============================= graph ============================= -->
  <rect x="345" y="538" width="460" height="56" rx="4" fill="#eaf4ec" stroke="#2c6e49" stroke-width="1.5"/>
  <text x="575" y="560" font-size="13" font-weight="600" text-anchor="middle" fill="#16202c">Graph — 117 entities, 267 edges</text>
  <text x="575" y="579" font-size="10.5" text-anchor="middle" fill="#5a6672">plain dicts and lists · every edge carries its document and explains itself (ADR-016)</text>

  <!-- ========================== routing tiers ======================== -->
  <text x="20" y="632" font-size="11.5" font-weight="600" fill="#5a6672">Query — each tier runs only if the previous one declined</text>

  <rect x="290" y="638" width="150" height="110" rx="4" fill="#eef3f9" stroke="#2f4a6d" stroke-width="1.5"/>
  <text x="365" y="659" font-size="12" font-weight="600" text-anchor="middle" fill="#16202c">Tier 1 — templates</text>
  <text x="365" y="678" font-size="9.8" text-anchor="middle" fill="#5a6672" font-family="Consolas, monospace">src/query/route.py</text>
  <text x="365" y="697" font-size="9.8" text-anchor="middle" fill="#3c4a5a">7/7 dev 1B (ADR-017)</text>
  <text x="365" y="713" font-size="9.8" text-anchor="middle" fill="#3c4a5a">no route shape on</text>
  <text x="365" y="729" font-size="9.8" text-anchor="middle" fill="#3c4a5a">35 of 49 (ADR-025)</text>

  <rect x="500" y="638" width="150" height="110" rx="4" fill="#eef3f9" stroke="#2f4a6d" stroke-width="1.5"/>
  <text x="575" y="659" font-size="12" font-weight="600" text-anchor="middle" fill="#16202c">Tier 2 — cue fallback</text>
  <text x="575" y="678" font-size="9.8" text-anchor="middle" fill="#5a6672" font-family="Consolas, monospace">src/query/fallback.py</text>
  <text x="575" y="697" font-size="9.8" text-anchor="middle" fill="#3c4a5a">17 correct / 27 complete</text>
  <text x="575" y="713" font-size="9.8" text-anchor="middle" fill="#3c4a5a">evidence on 49 (ADR-024)</text>
  <text x="575" y="729" font-size="9.8" text-anchor="middle" fill="#3c4a5a">40% precision vs 91%</text>

  <rect x="710" y="638" width="150" height="110" rx="4" fill="#fdf3e3" stroke="#b06d10" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="785" y="659" font-size="12" font-weight="600" text-anchor="middle" fill="#16202c">Tier 3 — LLM plan</text>
  <text x="785" y="678" font-size="9.8" text-anchor="middle" fill="#5a6672" font-family="Consolas, monospace">src/query/planner.py</text>
  <text x="785" y="697" font-size="9.8" text-anchor="middle" fill="#3c4a5a">emits a plan, never an</text>
  <text x="785" y="713" font-size="9.8" text-anchor="middle" fill="#3c4a5a">answer · validated, then</text>
  <text x="785" y="729" font-size="9.8" text-anchor="middle" fill="#8a5a08" font-weight="600">walked · OFF BY DEFAULT</text>

  <text x="470" y="688" font-size="9.5" text-anchor="middle" fill="#5a6672">declines</text>
  <text x="680" y="688" font-size="9.5" text-anchor="middle" fill="#5a6672">declines</text>

  <!-- ============================ answer ============================= -->
  <rect x="345" y="808" width="460" height="56" rx="4" fill="#eaf4ec" stroke="#2c6e49" stroke-width="1.5"/>
  <text x="575" y="830" font-size="13" font-weight="600" text-anchor="middle" fill="#16202c">Answer — status · values · evidence paths · documents</text>
  <text x="575" y="849" font-size="10.5" text-anchor="middle" fill="#5a6672">a miss returns a named EvidenceStatus, never an empty result</text>

  <!-- =========================== synthesis =========================== -->
  <rect x="345" y="884" width="460" height="64" rx="4" fill="#eef3f9" stroke="#2f4a6d" stroke-width="1.5"/>
  <text x="575" y="906" font-size="13" font-weight="600" text-anchor="middle" fill="#16202c">src/query/synthesis.py — prose from an already-verified chain</text>
  <text x="575" y="925" font-size="10.5" text-anchor="middle" fill="#3c4a5a">phrasing: model | template | none — counted, and the template path needs no API key</text>
  <text x="575" y="941" font-size="10.5" text-anchor="middle" fill="#5a6672">the model rewords retrieved evidence; it never selects it</text>

  <!-- =============================== ui ============================== -->
  <rect x="345" y="988" width="460" height="64" rx="4" fill="#eef3f9" stroke="#2f4a6d" stroke-width="1.5"/>
  <text x="575" y="1010" font-size="13" font-weight="600" text-anchor="middle" fill="#16202c">src/ui/ — stdlib http.server, no new dependency</text>
  <text x="575" y="1029" font-size="10.5" text-anchor="middle" fill="#3c4a5a">nine demo surfaces · /graph renders all 117 entities as one static SVG, no CDN, no JS</text>
  <text x="575" y="1045" font-size="10.5" text-anchor="middle" fill="#5a6672">adds no reasoning of its own — thinness pinned by three architectural tests (ADR-018)</text>

  <!-- ======================== left gutter: config ==================== -->
  <rect x="20" y="194" width="250" height="92" rx="4" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="145" y="216" font-size="11.5" font-weight="600" text-anchor="middle" fill="#16202c">config/ — claims, not code</text>
  <text x="145" y="236" font-size="10" text-anchor="middle" fill="#5a6672" font-family="Consolas, monospace">authority.yaml · relations.yaml</text>
  <text x="145" y="252" font-size="10" text-anchor="middle" fill="#5a6672" font-family="Consolas, monospace">corpus_manifest.sha256</text>
  <text x="145" y="272" font-size="10" text-anchor="middle" fill="#5a6672">a judge can disagree with one line (ADR-005)</text>

  <!-- ======================== left gutter: caches ==================== -->
  <rect x="20" y="326" width="250" height="100" rx="4" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="145" y="348" font-size="11.5" font-weight="600" text-anchor="middle" fill="#16202c">.cache/ · ocr_cache/</text>
  <text x="145" y="368" font-size="10" text-anchor="middle" fill="#5a6672" font-family="Consolas, monospace">corpus.v1.json · embeddings</text>
  <text x="145" y="384" font-size="10" text-anchor="middle" fill="#5a6672" font-family="Consolas, monospace">index · responses</text>
  <text x="145" y="404" font-size="10" text-anchor="middle" fill="#5a6672">reruns cost no quota;</text>
  <text x="145" y="418" font-size="10" text-anchor="middle" fill="#8a5a08" font-weight="600">never demo on a cold cache</text>

  <!-- ==================== right gutter: model calls ================== -->
  <text x="880" y="182" font-size="11.5" font-weight="600" fill="#5a6672">External model calls — all four, isolated</text>

  <rect x="880" y="194" width="240" height="76" rx="4" fill="#fdf3e3" stroke="#b06d10" stroke-width="1.4"/>
  <text x="1000" y="216" font-size="11.5" font-weight="600" text-anchor="middle" fill="#16202c">Gemini — OCR</text>
  <text x="1000" y="235" font-size="10" text-anchor="middle" fill="#5a6672">17 scans, transcribed once,</text>
  <text x="1000" y="250" font-size="10" text-anchor="middle" fill="#5a6672">cache committed to the repo</text>
  <text x="1000" y="264" font-size="10" text-anchor="middle" fill="#5a6672">ingest-time only · 0 at query time</text>

  <rect x="880" y="326" width="240" height="122" rx="4" fill="#fdf3e3" stroke="#b06d10" stroke-width="1.4"/>
  <text x="1000" y="348" font-size="11.5" font-weight="600" text-anchor="middle" fill="#16202c">Checkpoint 1 baseline</text>
  <text x="1000" y="367" font-size="10" text-anchor="middle" fill="#5a6672">Voyage embeddings + Gemini</text>
  <text x="1000" y="382" font-size="10" text-anchor="middle" fill="#5a6672">3,392 chunks · NumPy matmul,</text>
  <text x="1000" y="396" font-size="10" text-anchor="middle" fill="#5a6672">no vector database</text>
  <text x="1000" y="416" font-size="10" text-anchor="middle" fill="#3c4a5a" font-weight="600">1B 2/7 · 0/9 complete evidence</text>
  <text x="1000" y="434" font-size="10" text-anchor="middle" fill="#5a6672">comparison arm, not the answer path</text>

  <rect x="880" y="638" width="240" height="110" rx="4" fill="#fdf3e3" stroke="#b06d10" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1000" y="660" font-size="11.5" font-weight="600" text-anchor="middle" fill="#16202c">OpenRouter — planner</text>
  <text x="1000" y="679" font-size="10" text-anchor="middle" fill="#8a5a08" font-weight="600">off by default (F-025)</text>
  <text x="1000" y="697" font-size="10" text-anchor="middle" fill="#5a6672">a validated plan was once</text>
  <text x="1000" y="712" font-size="10" text-anchor="middle" fill="#5a6672">well-formed and about nothing;</text>
  <text x="1000" y="727" font-size="10" text-anchor="middle" fill="#5a6672">three guards added</text>
  <text x="1000" y="742" font-size="10" text-anchor="middle" fill="#5a6672">unmeasured on the frozen set</text>

  <rect x="880" y="884" width="240" height="64" rx="4" fill="#fdf3e3" stroke="#b06d10" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1000" y="906" font-size="11.5" font-weight="600" text-anchor="middle" fill="#16202c">OpenRouter — phrasing</text>
  <text x="1000" y="925" font-size="10" text-anchor="middle" fill="#8a5a08" font-weight="600">off by default</text>
  <text x="1000" y="941" font-size="10" text-anchor="middle" fill="#5a6672">template phrasing needs no key</text>

  <!-- ============================= arrows ============================ -->
  <g stroke="#2f4a6d" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M575,154 V194"/>
    <path d="M575,286 V326"/>
    <path d="M575,382 V422"/>
    <path d="M575,506 V538"/>
    <path d="M575,594 V616 H365 V638"/>
    <path d="M440,693 H500"/>
    <path d="M650,693 H710"/>
    <path d="M575,780 V808"/>
    <path d="M575,864 V884"/>
    <path d="M575,948 V988"/>
  </g>
  <g stroke="#2f4a6d" stroke-width="1.6" fill="none">
    <path d="M365,748 V780"/>
    <path d="M575,748 V780"/>
    <path d="M785,748 V780"/>
    <path d="M365,780 H785"/>
  </g>

  <!-- dashed connectors: configuration, caches, model calls -->
  <g stroke="#8a8a8a" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-muted)">
    <path d="M270,240 H305"/>
    <path d="M270,276 H288 V464 H305"/>
    <path d="M845,232 H880"/>
    <path d="M805,354 H852 V387 H880"/>
    <path d="M860,693 H880"/>
    <path d="M805,916 H880"/>
  </g>
  <g stroke="#8a8a8a" stroke-width="1.3" fill="none" stroke-dasharray="5 4"
     marker-start="url(#arrow-muted)" marker-end="url(#arrow-muted)">
    <path d="M270,354 H345"/>
  </g>

  <!-- ============================= legend ============================ -->
  <g font-size="10.5" fill="#5a6672">
    <rect x="20" y="1064" width="18" height="12" rx="2" fill="#eef3f9" stroke="#2f4a6d" stroke-width="1.3"/>
    <text x="45" y="1074">deterministic code</text>

    <rect x="175" y="1064" width="18" height="12" rx="2" fill="#eaf4ec" stroke="#2c6e49" stroke-width="1.3"/>
    <text x="200" y="1074">data structure</text>

    <rect x="310" y="1064" width="18" height="12" rx="2" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.3"/>
    <text x="335" y="1074">configuration / cache</text>

    <rect x="480" y="1064" width="18" height="12" rx="2" fill="#fdf3e3" stroke="#b06d10" stroke-width="1.3"/>
    <text x="505" y="1074">external model call</text>

    <rect x="645" y="1064" width="18" height="12" rx="2" fill="#fdf3e3" stroke="#b06d10" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="670" y="1074">dashed = off by default; no test or eval sweep can reach it (F-025)</text>
  </g>
</svg>
