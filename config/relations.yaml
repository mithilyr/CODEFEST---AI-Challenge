# Infobox field names -> canonical relations.
#
# 109 distinct field names express roughly a dozen relations. `Member of`,
# `Membership`, `Affiliation` and `Allegiance` are one relation; `Housed in` and
# `Place of housing` are another. A parser keyed on literal field names loses a
# third of the membership edges and never says so.
#
# This lives in config rather than in code for the same reason authority.yaml
# does (ADR-005): it is a claim about the corpus, and a judge should be able to
# read it, disagree with a line, and change it without touching Python.
#
# direction:
#   forward  the page's subject is the source of the edge
#            `Member of | [[The Silent Choir]]` on a character page
#   reverse  the page's subject is the TARGET; the cell names the source
#            `Members | Ravena Stormwell; ...` on a faction page
#
# cues:
#   Extra *question* vocabulary for a relation, used only by the cue-based
#   fallback router (src/query/fallback.py), never by the graph builder.
#   Field names describe how the corpus writes a fact; cues describe how a
#   person asks about it. `Apprentice` is not an infobox field name anywhere in
#   the archive, so listing it under `fields` would assert something false about
#   the corpus and would map a future `| Apprentice | [[X]] |` row in whatever
#   direction we happened to write. It is question vocabulary, and lives here.
#
# Reverse matters more than it looks. The Silent Choir's membership is recorded
# in two disjoint places - 6 names on the faction page's `Members` row, 8 more on
# individual character pages, with zero overlap. Reading only one direction loses
# half the edges, and 1b_006 needs all fourteen.

# Which corpus collections play which role. A "collection" is the top-level
# folder name under the corpus root, assigned by src/ingest/metadata.py.
#
# These were literals in Python until ADR-035 - `if unit.collection == "wiki":`
# in build.py and a frozenset in corroborate.py. MEASURED: renaming the corpus
# folders to `manuals/`, `specs/` and `logs/` ingested 10 documents and 18
# evidence units correctly and then built a graph of **0 nodes and 0 edges**,
# silently, because no unit's collection was the string "wiki". The system read
# every file and answered nothing.
#
# They live here for ADR-005's reason, the same one the field names above live
# here for: it is a claim about the corpus, not a fact about the code, and a
# judge should be able to disagree with one line without touching Python.
#
# builds:       collections whose infobox rows construct nodes and edges.
# corroborates: collections that may attest an edge but never build one
#               (ADR-027). A collection must not appear in both: a page
#               corroborating an edge parsed from itself is one source agreeing
#               with itself.
sources:
  builds: [wiki]
  corroborates: [chronicles, codex, ephemera]

relations:
  member_of:
    inverse: has_member
    fields:
      forward: [Member of, Membership, Affiliation, Allegiance]
      reverse: [Members, Member, Known members, Personnel, Castellan]
    # NOT `Known participant`, `Notable fighter` or `Serving figure`. All three
    # sat here until 6 Sep and all three were wrong, each in the same way: the
    # page they appear on is not a faction, so the cell does not record
    # membership. `Notable fighter` is on `the_winter_reckoning.md` and
    # `Known participant` on `the_leaden_accord.md` - a war and an accord - so
    # the person named FOUGHT IN it (belligerent_in). `Serving figure` is on
    # `palewell_abbey.md`, a place, so the person SERVES AT it (serves_at).
    # The graph asserted `brannoc_palefroth member_of winter_reckoning`:
    # membership in a war.
    #
    # Found by `eval/probes/prose_relations.py` (ADR-034), which read the codex
    # and chronicles against the graph: the prose says "fought in The Winter
    # Reckoning" and "serves at Palewell Abbey" where the infobox mapping said
    # "member of". Cross-collection evidence caught a defect the infobox parse
    # could not see, because the wiki row's field name is the only thing the
    # builder gets and a field name can be misread.
    #
    # Each of the three field names occurs EXACTLY ONCE in the corpus, so the
    # blast radius of moving them is four rows, checked before the move.
    # Every field name above is a *record-keeping* noun. None is how a person
    # asks the question: "the faction X belongs to" cues nothing at all, which
    # is why 3h_002's middle hop was never considered (ADR-031).
    # NOT "house": it stems to `hous`, which is housed_in's cue. Adding it would
    # make that word shared, and a shared word is dropped from
    # `unique_relation_cues()` - so it would silently weaken ADR-029's coverage
    # guard as a side effect of extending vocabulary. Check collisions before
    # adding any cue.
    cues: [belongs]

  ruled_by:
    inverse: rules
    fields:
      forward: [Ruled by, Ruler, Ruling power]

  lair_in:
    inverse: lair_of
    fields:
      forward: [Lair]

  in_region:
    inverse: contains
    fields:
      forward: [Region, Core location, Location, Major setting, Seat]

  housed_in:
    inverse: houses
    fields:
      forward: [Housed in, Place of housing]

  forged_at:
    inverse: forge_of
    fields:
      forward: [Forged at, Place of forging]

  serves_at:
    inverse: served_by
    fields:
      forward: [Serves at, Service, Place of service, Place of Service,
                Serves at Emberdeep, Serves at Greyfell Citadel,
                Serves at the fortress, Serving at Crookvale,
                Personnel serving at Hollowreach]
      # `Serving figure` on `palewell_abbey.md` names the person; the page's
      # subject is the place being served at, so this is the reverse direction.
      reverse: [Serving figure]
    # NOT `Military service`. Its one occurrence reads
    #   `Military service | Fought for [[The Ashen Vanguard]] in [[The Leaden Accord]]`
    # which is the two-argument clause ADR-010 describes: one ternary fact whose
    # conflict argument is The Leaden Accord. Mapped here it produced
    # `sabelle_mournvale serves_at leaden_accord` - serving at an accord. The
    # verb in the cell is "Fought", so the field belongs to belligerent_in.

  wields:
    inverse: wielded_by
    fields:
      forward: [Wields, Wielded relic, Wielded weapon, Weapon, Weapon or Relic,
                Relic, Later weapon record]

  victor_of:
    inverse: won_by
    fields:
      forward: [Victor of]
      # `Victor` on a conflict page names who won *that* conflict, so the page
      # is the target and the cell is the source.
      reverse: [Victor]

  belligerent_in:
    inverse: had_belligerent
    fields:
      forward: [Belligerent, Belligerent in, Belligerencies, Conflict,
                Military action, Military involvement, Military record,
                Major fighting, Military service]
      # Both occur on a CONFLICT's page and name a person who fought in it, so
      # the page's subject is the target and the cell names the source. They sat
      # under `member_of` reverse until 6 Sep, which asserted that a person can
      # be a member of a war. See the note on member_of and ADR-034.
      reverse: [Known participant, Notable fighter]

  mentor_of:
    inverse: mentored_by
    fields:
      forward: [Mentor of, Mentorship]
      reverse: [Mentor]
    # The relation name and its inverse both stem to "mentor", so a question
    # that names the other party's role instead cues nothing. rb_044 asks for
    # "the apprentice of X" and reached member_of, ruled_by and serves_at but
    # never mentor_of.
    cues: [apprentice]

  rival_of:
    inverse: rival_of          # symmetric
    fields:
      forward: [Rival, Rival of, Rivals]

  devastated:
    inverse: devastated_by
    fields:
      forward: [Devastated, Devastated sites, Major devastation]

  waged_at:
    inverse: hosted_conflict
    fields:
      forward: [Waged at, Unleashed in]

  concealed_tie_to:
    inverse: concealed_tie_from
    fields:
      forward: [Secret, Secret truth, Concealed truth, Historical association]

# Field names that carry attributes, not edges. Listed explicitly rather than
# left to fall through, so that a NEW field name appearing in the corpus is
# reported as unmapped instead of being silently ignored.
attributes:
  [Name, Born, Died, Role, Status, Appearance, Demeanor, Doctrine, Era,
   Threat rating, Garrison strength, Founded, Began, Ended, Forged, Forging date,
   Habit, Classification, Artifact class, Attunement cost, Attack character,
   Character, Creature, Danger, Nature, Outcome, Position, Primary function,
   Casualties, Casualty figure, Command, Commands, Organization kind,
   Organization type, Organizational kind, Holding classification,
   Physical description, Physical traits, Visual identity, Type,
   Related location and year, Related region and year, Secret keeper]
